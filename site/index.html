<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myanglish: Myanmar text to English-letter slugs</title>
<meta name="description" content="Live demo of myanglish: romanize Myanmar (Burmese) text into clean URL slugs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ede1;
    --ink: #1d1a16;
    --muted: #6b6257;
    --rule: #cfc4b1;
    --accent: #b8431f;
    --ok: #2f6b3a;
    --serif: 'Instrument Serif', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --my: 'Padauk', 'Myanmar Text', 'Noto Sans Myanmar', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 var(--mono);
  }
  main { max-width: 1040px; margin: 0 auto; padding: 56px 28px 96px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink); padding-bottom: 14px; }
  h1 { font: italic 400 clamp(44px, 8vw, 88px)/0.9 var(--serif); margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); font-style: normal; }
  header nav { display: flex; gap: 18px; font-size: 13px; }
  a { color: var(--ink); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  .lede { font: 400 22px/1.35 var(--serif); max-width: 34ch; margin: 22px 0 40px; color: var(--muted); }

  .specimen { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .specimen > div { padding: 22px 0; min-width: 0; }
  .arrow { padding: 22px 24px !important; font: 400 40px/1 var(--serif); color: var(--accent); align-self: center; }
  label { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; border: 0; background: transparent; color: var(--ink);
    font: 400 34px/1.6 var(--my); padding: 0; outline: none;
  }
  textarea:focus-visible { box-shadow: 0 2px 0 var(--accent); }
  output { display: block; font: 500 26px/1.4 var(--mono); word-break: break-word; min-height: 1.4em; }
  output:empty::before { content: '—'; color: var(--rule); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  button {
    font: 500 13px/1 var(--mono); color: var(--ink); background: transparent;
    border: 1px solid var(--ink); border-radius: 999px; padding: 10px 16px; cursor: pointer;
    transition: background-color 150ms, color 150ms;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .samples { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 64px; }
  .samples button { font: 400 18px/1 var(--my); padding: 10px 14px; border-color: var(--rule); }

  h2 { font: italic 400 40px/1 var(--serif); margin: 0 0 8px; }

  code { background: rgba(29,26,22,0.07); padding: 1px 6px; border-radius: 4px; }
  pre { background: var(--ink); color: var(--paper); padding: 18px 20px; border-radius: 8px; overflow: auto; font-size: 14px; }
  section { margin-top: 72px; }
  footer { margin-top: 80px; padding-top: 14px; border-top: 1px solid var(--ink); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 760px) {
    .specimen { grid-template-columns: 1fr; }
    .arrow { padding: 0 !important; transform: rotate(90deg); justify-self: start; }
    textarea { font-size: 28px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise 600ms cubic-bezier(.2,.7,.2,1) both; }
    .reveal:nth-child(2) { animation-delay: 80ms; }
    .reveal:nth-child(3) { animation-delay: 160ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  }
</style>
</head>
<body>
<main>
  <header class="reveal">
    <h1>my<span>·</span>anglish</h1>
    <nav>
      <a href="https://www.npmjs.com/package/myanglish">npm</a>
      <a href="https://github.com/hheinsoee/myanglish">GitHub</a>
    </nav>
  </header>
  <p class="lede reveal">Myanmar text in, readable English-letter slug out. Runs entirely in this page.</p>

  <div class="specimen reveal">
    <div>
      <label for="src">Myanmar</label>
      <textarea id="src" lang="my" spellcheck="false">မြန်မာ စာအုပ်ဆိုင်</textarea>
    </div>
    <div class="arrow" aria-hidden="true">→</div>
    <div>
      <label for="out">Slug</label>
      <output id="out" for="src" aria-live="polite"></output>
      <div class="row">
        <button id="copy" type="button">Copy</button>
      </div>
    </div>
  </div>

  <div class="samples" aria-label="Examples">
    <button type="button" lang="my">ကျောင်း</button>
    <button type="button" lang="my">ရန်ကုန်</button>
    <button type="button" lang="my">သင်္ချာ</button>
    <button type="button" lang="my">အင်္ဂလိပ်စာ</button>
    <button type="button" lang="my">English Grammar ၂၀၂၆</button>
  </div>

  <section aria-labelledby="use-h">
    <h2 id="use-h">Use it</h2>
    <pre><code>npm install myanglish

import { slugify } from 'myanglish'
slugify('မြန်မာ')   // 'myan-ma'</code></pre>
  </section>

  <footer>
    <span>MIT · zero dependencies</span>
    <span>Romanization is an approximation, not an official transliteration.</span>
  </footer>
</main>

<script type="module">
  import { slugify } from './myanglish.js'

  const $ = (id) => document.getElementById(id)
  const src = $('src'), out = $('out')

  const render = () => { out.textContent = slugify(src.value) }
  src.addEventListener('input', render)
  render()

  document.querySelectorAll('.samples button').forEach((b) =>
    b.addEventListener('click', () => { src.value = b.textContent; render(); src.focus() }))

  $('copy').addEventListener('click', async () => {
    if (!out.textContent) return
    await navigator.clipboard.writeText(out.textContent)
    $('copy').textContent = 'Copied'
    setTimeout(() => { $('copy').textContent = 'Copy' }, 1200)
  })
</script>
</body>
</html>
